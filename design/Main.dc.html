<html>

<body>
<x-dc>

  </div>

      <svg viewBox="0 0 200 170" width="26" height="22">
        <ellipse cx="64" cy="28" rx="12" ry="10" fill="#DCAE79" stroke="#5A4531" stroke-width="7"></ellipse>
        <ellipse cx="136" cy="28" rx="12" ry="10" fill="#DCAE79" stroke="#5A4531" stroke-width="7"></ellipse>

        <ellipse cx="100" cy="100" rx="30" ry="46" fill="#C08A57"></ellipse>
        <path d="M90 86 Q100 94 110 86" stroke="#5A4531" stroke-width="6" fill="none" stroke-linecap="round"></path>
        <path d="M100 92 V 116" stroke="#5A4531" stroke-width="6" stroke-linecap="round"></path>
        <path d="M42 76 Q51 72 60 76" stroke="#5A4531" stroke-width="6" fill="none" stroke-linecap="round"></path>
        <path d="M140 76 Q149 72 158 76" stroke="#5A4531" stroke-width="6" fill="none" stroke-linecap="round"></path>
      </svg>
      <div style="font-size: 19px; color: #2f9e44">2<span style="color: #5b4232">/5</span></div>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 8px 18px; box-shadow: 0 2px 8px rgba(91,66,50,0.10); display: flex; align-items: center; gap: 5px">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="#E8554D"><path d="M12 21s-7.5-4.7-10-9.3C.4 8.6 2.4 5 6 5c2.2 0 3.6 1.2 6 3.6C14.4 6.2 15.8 5 18 5c3.6 0 5.6 3.6 4 6.7C19.5 16.3 12 21 12 21Z"></path></svg>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="#E8554D"><path d="M12 21s-7.5-4.7-10-9.3C.4 8.6 2.4 5 6 5c2.2 0 3.6 1.2 6 3.6C14.4 6.2 15.8 5 18 5c3.6 0 5.6 3.6 4 6.7C19.5 16.3 12 21 12 21Z"></path></svg>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="#EBD9CB"><path d="M12 21s-7.5-4.7-10-9.3C.4 8.6 2.4 5 6 5c2.2 0 3.6 1.2 6 3.6C14.4 6.2 15.8 5 18 5c3.6 0 5.6 3.6 4 6.7C19.5 16.3 12 21 12 21Z"></path></svg>
    </div>
  </div>
  <div style="background: #FFFFFF; border-radius: 18px; padding: 10px; box-shadow: 0 2px 8px rgba(91,66,50,0.08); display: flex; gap: 8px">
    <div style="flex-grow: 1; border: 2px solid #B98A5E; border-radius: 12px; padding: 8px 6px; font-size: 13.5px; color: #5b4232; text-align: center; font-family: 'Apple SD Gothic Neo', sans-serif; font-weight: 600">색깔마다<br>카피바라 1마리</div>
    <div style="flex-grow: 1; border: 2px solid transparent; border-radius: 12px; padding: 8px 6px; font-size: 13.5px; color: #5b4232; text-align: center; font-family: 'Apple SD Gothic Neo', sans-serif">각 행과 열에<br>1마리</div>
    <div style="flex-grow: 1; border: 2px solid transparent; border-radius: 12px; padding: 8px 6px; font-size: 13.5px; color: #5b4232; text-align: center; font-family: 'Apple SD Gothic Neo', sans-serif">서로 붙어<br>있을 수 없어요</div>
  </div>
  <div style="background: #FFFFFF; border-radius: 20px; padding: 10px; box-shadow: 0 4px 14px rgba(91,66,50,0.10)">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{cells}}" as="cell" hint-placeholder-count="25">
        <div style="aspect-ratio: 1; border-radius: 12px; background: {{cell.bg}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{cell.isCapy}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 200 170" width="48" height="41">
              <ellipse cx="64" cy="28" rx="12" ry="10" fill="#DCAE79" stroke="#5A4531" stroke-width="5.5"></ellipse>
              <ellipse cx="136" cy="28" rx="12" ry="10" fill="#DCAE79" stroke="#5A4531" stroke-width="5.5"></ellipse>
              <rect x="26" y="24" width="148" height="134" rx="58" fill="#DCAE79" stroke="#5A4531" stroke-width="5.5"></rect>
              <ellipse cx="100" cy="100" rx="30" ry="46" fill="#C08A57"></ellipse>
              <path d="M91 86 Q100 93 109 86" stroke="#5A4531" stroke-width="5" fill="none" stroke-linecap="round"></path>
              <path d="M100 92 V 114" stroke="#5A4531" stroke-width="5" stroke-linecap="round"></path>
              <path d="M100 114 Q94 121 87 119 M100 114 Q106 121 113 119" stroke="#5A4531" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
              <path d="M44 74 Q52 70 60 74" stroke="#5A4531" stroke-width="5" fill="none" stroke-linecap="round"></path>
              <path d="M140 74 Q148 70 156 74" stroke="#5A4531" stroke-width="5" fill="none" stroke-linecap="round"></path>
            </svg>
          </sc-if>
          <sc-if value="{{cell.isX}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 24 24" width="26" height="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: center; gap: 44px; padding-bottom: 10px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 58px; height: 58px; border-radius: 29px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(91,66,50,0.12); display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6B4A38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 L4 9 L15 -2" transform="translate(2,6) scale(0.9)"></path><path d="M4 10 h13 a4 4 0 0 1 0 8 h-6" transform="translate(1,1)"></path></svg>
      </div>
      <div style="font-size: 13px; color: #8a715c; font-family: 'Apple SD Gothic Neo', sans-serif">실행취소</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 58px; height: 58px; border-radius: 29px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(91,66,50,0.12); display: flex; align-items: center; justify-content: center; position: relative">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6B4A38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0 0 12 3Z"></path></svg>
        <div style="position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 11px; background: #E8554D; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center">3</div>
      </div>
      <div style="font-size: 13px; color: #8a715c; font-family: 'Apple SD Gothic Neo', sans-serif">힌트</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 58px; height: 58px; border-radius: 29px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(91,66,50,0.12); display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="#6B4A38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"></path></svg>
      </div>
      <div style="font-size: 13px; color: #8a715c; font-family: 'Apple SD Gothic Neo', sans-serif">지우기</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 엔진이 실제로 생성한 5×5 퍼즐 (seed 7). 정답: [4,2,0,3,1]
    const regions = [
      [2,2,0,0,0],
      [2,1,1,0,0],
      [2,3,1,1,0],
      [2,3,3,3,0],
      [2,4,4,3,3],
    ];
    const colors = ['#F6CE7E', '#A8CDEB', '#F2A7B8', '#B7D8A8', '#C9BCE9'];
    const capys = [[2,0],[0,4]];
    const xs = [[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[2,1],[2,2],[2,3],[2,4],[3,0],[3,1],[4,0],[1,4],[3,4],[1,3]];
    const has = (list, r, c) => list.some((p) => p[0] === r && p[1] === c);
    const cells = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        cells.push({
          bg: colors[regions[r][c]],
          isCapy: has(capys, r, c),
          isX: !has(capys, r, c) && has(xs, r, c),
        });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
